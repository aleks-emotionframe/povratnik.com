title: "Rückkehr und Zuwanderung in Zahlen"
short_answer: "Kroatien hat seit 2023 einen positiven Wanderungssaldo, getragen zu über 80 Prozent von Arbeitsmigration, nicht von der Diaspora. 2025 war der Saldo kroatischer Staatsbürger erstmals positiv. Die Rückkehrförderung Biram Hrvatsku wächst jedes Jahr."
