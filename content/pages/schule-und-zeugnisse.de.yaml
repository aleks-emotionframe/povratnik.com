title: Schule, Zeugnisse und Hochschulabschlüsse anerkennen lassen
short_answer: Schulkinder werden über die aufnehmende Schule eingestuft, die bisherigen Schuljahre werden dort anerkannt. Schulzeugnisse für den Hochschulzugang und ausländische Hochschulabschlüsse laufen über die Agentur AZVO, für Hochschulabschlüsse über das ENIC/NARIC-Büro, Verfahren im besten Fall 60 Tage, Antrag nur per Post.
terms:
  - term_hr: AZVO
    term_explained:
      de: Agencija za znanost i visoko obrazovanje, die Agentur für Wissenschaft und Hochschulbildung. Zuständig für die Anerkennung ausländischer Zeugnisse und Abschlüsse.
  - term_hr: ENIC/NARIC ured
    term_explained:
      de: Das nationale Anerkennungsbüro innerhalb der AZVO, seit 25.6.2022 zuständig für Hochschulqualifikationen.
  - term_hr: upis u školu
    term_explained:
      de: Einschreibung in die Schule. Zuständig ist die Schule des Schulbezirks am Wohnsitz.
sections:
  applies_to: Familien mit schulpflichtigen Kindern, Studierende und Berufstätige mit ausländischen Abschlüssen.
  not_applies_to: Reglementierte Berufe, etwa Gesundheitsberufe. Dort läuft die Anerkennung über das PISK-System der zuständigen Kammer, ein eigenes Verfahren.
  authority: Schule des Schulbezirks am Wohnsitz. AZVO für Zeugnisse zum Hochschulzugang und für Hochschulabschlüsse.
  prerequisites:
    - Angemeldeter Wohnsitz, er bestimmt den Schulbezirk
    - Zeugnisse im Original mit Apostille und beglaubigter Übersetzung
  steps:
    - Vor der Abreise alle Zeugnisse und Schulbestätigungen im Herkunftsland anfordern
    - Apostille und Übersetzung veranlassen
    - Nach der Wohnsitzanmeldung die Schule des Bezirks kontaktieren und das Kind einschreiben, die Schule stuft ein
    - Für Hochschulzugang oder Abschlussanerkennung Antrag bei der AZVO per Post stellen
  documents:
    - Zeugnisse aller Schuljahre, Abschlusszeugnisse, Diplome
    - Apostille und beglaubigte Übersetzung
    - Wohnsitznachweis, Geburtsurkunde des Kindes
  duration_costs: Anerkennung von Hochschulqualifikationen im besten Fall 60 Tage. Das Ministerium für Demografie und Einwanderung finanziert die Übersetzung ausländischer Hochschulqualifikationen. Gebühren nicht belegt.
  deadlines:
    - Einschreibung vor Schuljahresbeginn, die Termine setzt die Schule
  common_mistake: Zeugnisse erst nach der Ankunft anfordern. Aus Südamerika dauert das Wochen, und die Apostille muss im Ausstellungsland angebracht werden.
  not_decided_here: Die Einstufung des Kindes trifft die Schule. Die Gleichwertigkeit eines Abschlusses stellt die AZVO fest.
  open_points:
    - Sprachförderung für Kinder ohne Kroatisch, Umfang und Zuständigkeit nicht belegt
    - Gebühren der AZVO nicht belegt
