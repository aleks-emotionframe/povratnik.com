title: Registering residence and stay
short_answer: Registration is not one procedure but three. Croatian citizens register their residence (prebivalište), people with temporary residence their place of stay (boravište), people with permanent or long-term residence every change. All three go through the police administration, as a rule within 15 days, and trigger deadlines in other procedures.
terms:
  - term_hr: prijava prebivališta
    term_explained:
      de: Wohnsitzanmeldung für kroatische Staatsbürger. Sie ist bei vielen Förderungen das massgebende Datum, nicht die Ankunft.
      en: Residence registration for Croatian citizens. For many support schemes it is the decisive date, not arrival.
  - term_hr: prijava boravišta
    term_explained:
      de: Meldung des Aufenthaltsorts für Personen mit vorübergehendem Aufenthalt. Seit NN 55/2026 binnen 15 Tagen statt zuvor drei.
      en: Registration of the place of stay for people with temporary residence. Since NN 55/2026 within 15 days instead of the previous three.
  - term_hr: stalni boravak, dugotrajni boravak
    term_explained:
      de: Daueraufenthalt und Langzeitaufenthalt. Änderungen der Adresse sind binnen 15 Tagen zu melden.
      en: Permanent residence and long-term residence. Changes of address must be reported within 15 days.
sections:
  applies_to: Everyone who lives in Croatia. Which of the three procedures applies depends on the status.
  not_applies_to: Tourists and short stays. The accommodation report by the landlord is a fourth, separate procedure and replaces none of the three registrations.
  authority: Ministarstvo unutarnjih poslova, police administration or police station at the place of residence.
  prerequisites:
    - Clarified status, that is citizenship or an approved residence
    - Proof of housing; a notarised rental contract suffices
    - OIB
  steps:
    - Clarify which of the three procedures applies
    - Obtain proof of housing; for rentals, have the contract notarised
    - Appear at the police administration and complete the registration
    - Note the date of registration; it triggers deadlines for support schemes, driving licence and removal goods
  documents:
    - Passport or identity card; for citizens the Domovnica
    - Proof of housing, such as a notarised rental contract or land register extract
    - Residence permit, where one exists
    - OIB
  duration_costs: The registration itself takes place at the counter. Fees not documented.
  deadlines:
    - Residence of Croatian citizens, as a rule within 15 days of moving in
    - Place of stay with temporary residence, within 15 days (NN 55/2026)
    - Changes with permanent or long-term residence, within 15 days of the change
  common_mistake: Postponing registration because there is no final home yet. For Biram Hrvatsku the application deadline runs from the day of registration, and the income tax exemption is tied to reporting the return. Whoever registers late postpones not just the registration, but everything that depends on it.
  not_decided_here: Whether a particular proof of housing suffices is decided by the police administration. Which deadline applies in a given case depends on the status and, if unsure, should be clarified professionally.
  open_points:
    - Fees not documented
    - Exact wording of the deadline for citizens to be checked in the original text
