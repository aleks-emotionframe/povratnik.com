# SYNTHETISCH. Fiktive Regel, Fassung 3, angelegt im Probelauf des Redaktionsdurchlaufs. Alle Werte erfunden.
id: example-address-report
version: 3
synthetic: true
trigger: entry
title:
  de: Beispielmeldung innerhalb von 50 Tagen (fiktive Fassung 3, Probelauf)
scope:
  applies_to_persons:
    citizenship_status: [third_country]
    residence_status: [temporary_residence]
  procedure: example-registration
conditions:
  - field: event.entry
    operator: exists
    on_unknown: clarify
  - field: person.age
    operator: gte
    value: 18
    on_unknown: clarify
result:
  task: example-register-address
  deadline:
    trigger: entry
    interval: 50
    unit: calendar_days
    counting_starts: day_after
    weekend_holiday_rule: extend_to_next_working_day
    kind: statutory
  status_text_key: rules.example_address_report.matches
sources:
  - id: example-source
    reference: Art. 1 Abs. 1, Fassung ab 2027 (fiktiv)
    checked: 2026-09-14
approval:
  state: in_review
publication:
  state: withdrawn
validity:
  valid_from: 2027-01-01
  valid_until:
    kind: open_ended
    date: null
  supersedes: example-address-report@2
  superseded_by: null
  transitional:
    de: Für Einreisen vor dem 01.01.2027 gilt Fassung 2 (fiktiv). Probelauf des Redaktionsdurchlaufs.
review:
  next_check: 2026-12-01
  cycle: monthly
