    t2: Regional and municipal measures
    t3: Family
    t4: Housing
    t5: Education
    t6: Mobility
    t7: Founding
    t8: Entitlement
    t9: Evidence
    t10: Cumulation
    t11: Commitments
    t12: Repayment obligations
situations:
  familie:
    title: I am coming with my family
    intro: Partner and children can have different citizenships and insurance bases. Each person has their own path, the household is the frame.
    trap: The children's health insurance depends on the parents' basis. Whoever does not plan the gap in advance is without a paediatrician in the first weeks.
  selbstaendig:
    title: I want to start a business
    intro: Some support schemes require the application before founding, others within a few days after. The order decides the entitlement.
    trap: Found first, read later. Whoever registers the business and applies too late has lost the return support.
  pensioniert:
    title: I am retired
    intro: Pension from abroad, health insurance without an employer, double taxation. On taxes and social security a Croatian professional must be consulted.
    trap: There is no double taxation agreement with the United States, Argentina and Brazil. Pensions from these countries must be reported by 31 January for the previous year.
  ohne-pass:
    title: I do not have a Croatian passport
    intro: "Without Croatian citizenship everything depends on the residence route: free movement for EU, EEA and Switzerland, the certificate for descendants of emigrants, otherwise work residence or digital nomad."
    trap: Confusing the certificate for emigrants with naturalisation. It is a residence route and can run in parallel with the citizenship procedure.
  allein:
    title: I am coming alone
    intro: "The shortest way: status, OIB, registration, insurance. After that integration counts, because that is where return most often fails."
    trap: Everyone leaves out the fifth phase, staying. Language, clubs and people who take you along belong in the plan from the start.
  arbeitgeber-im-ausland:
    title: I work for an employer abroad
    intro: Whoever works from Croatia for an employer abroad needs, depending on citizenship, a different residence route, and the tax question is not trivial.
    trap: Tax residency after 183 days. Whoever moves during the year may be taxable in two countries. A tax professional clarifies that, not this website.
cases:
  familie:
    name: Lucía, 32, Buenos Aires
    line: Great-grandparents from Dalmatia, no Croatian passport, partner without a link, one child of school age.
    shapes: The status is open, and the document chain across four generations is the longest single step. Her partner follows a completely different path.
    first: Have it checked whether the line of descent can be fully documented. Not the health insurance she had searched for.
  selbstaendig:
    name: Marko, 41, Stuttgart
    line: Croatian passport, partner too, two children, wants to become self-employed.
    shapes: The status is clear, the way is short. What matters is the order between support application and founding, and that the income tax exemption may not apply to self-employment at all.
    first: Read the current call before registering anything.
  arbeitgeber-im-ausland:
    name: Anna, 29, Vienna
    line: EU citizen without Croatian roots, alone, works from Croatia for an Austrian employer.
    shapes: "Residence is uncomplicated. Her real risk is tax: residency, double taxation and social security when working for a foreign employer, with retroactive effect."
    first: Clarify this point before the move, not after.
  pensioniert:
    name: Ivan, 58, Toronto
    line: Croatian passport, partner without one, lives on a Canadian pension, move open.
    shapes: His partner follows a different path than he does. His health insurance does not follow from employment; that is where gaps arise. Return support for work and founding does not apply to him.
    first: Clarify pension crediting and the insurance basis, with the agreement between Canada and Croatia.
  ohne-pass:
    name: Sofía, 26, Santiago de Chile
    line: Does not know whether her grandmother held citizenship. Alone, move later or unclear.
    shapes: The plan consists almost entirely of clarification tasks, and that is right. It shows her which three pieces of information she needs before anything can be planned.
    first: Three concrete, doable steps instead of the certainty that she could already plan.
