    keys_help: And in this order. It is the common thread of the whole website.
    key1_title: Status
    key1_sub: Who am I legally?
    key1_text: Decides the residence route and access to work, school and support.
    key2_title: OIB
    key2_text: The tax number. Without it no bank account, no rental contract, no application, no employment contract.
    key3_title: Registration
    key3_text: Triggers deadlines and for many support schemes is the decisive date, not arrival.
    key4_title: Insurance
    key4_text: Enables doctor visits, school enrolment, a childcare place. Has a gap if it was not planned in advance.
