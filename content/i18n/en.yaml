summary:
  different:
    status_unknown: "The citizenship of {person} is still open. Nothing can be decided before the status, so clarification comes first."
    mixed_household: Not everyone in your household has the same citizenship. Each person therefore follows their own path, and deadlines run separately.
    arrived: You are already in Croatia. Deadlines run from entry and registration, not from the day you read this page.
    self_employed_tax: You plan to be self-employed. The five-year income tax exemption applies to wages from employment; whether and how it applies to you is for a tax professional to clarify.
    remote: Work for an employer abroad. The residence route depends on citizenship, the tax question on tax residency. Neither is a standard case.
    children: Children in the household. School and paediatrician depend on the parents' registration and insurance; the parents' order sets the children's.
    already_founded: You have already founded your business. Some support schemes require the application before or shortly after founding; whether a deadline is still open should be checked immediately.
  chain:
    status: Status
    oib: OIB
    registration: Registration
    insurance: Insurance
    clear: clarified
    open: to clarify
    next: follows
    bottleneck: bottleneck
  clarify:
    founded_deadline: "Already founded: clarify immediately with the HZZ whether the Biram Hrvatsku application deadline (30 days after self-employment) is still open."
    sector_excluded: According to your answers your sector is among the excluded ones. Whether an exception applies is decided by the HZZ based on the current call.
    sector_unknown: Whether your sector is eligible is stated in the current HZZ call. Check before founding.
    regulated: "Recognition of the profession ({person}): a separate preliminary step through the competent chamber (PISK). Which chamber depends on the profession."
    care: "Ongoing medical need: clarify care at the destination and transitional cover before departure, with the HZZO and the local practice."
    inherited: "Inherited family property: have a lawyer in Croatia check the land register and co-owners before any step."
    buy: "Property purchase: whether you may buy as a foreigner and whether reciprocity exists is decided by the Ministry of Justice."
    child_language: "Language support ({person}): offer and competence depend on the school district; ask at the school at the destination."
    pension_no_agreement: "Pension ({person}): there is no double taxation agreement with this country. Clarify reporting duty and taxation with a tax professional."
checklists:
  arrive:
    a1: Register residence with the police administration, note the date
    a2: Present or apply for the OIB for each person
    a3: Arrange health insurance with the HZZO, check supplementary insurance
    a4: Open a bank account
    a5: Enrol children in kindergarten or school
    a6: Find a family doctor and paediatrician, have admission confirmed
    a7: Register electricity, water, internet, telephone
    a8: Exchange the driving licence, mind the deadline from entry
    a9: Import and register the vehicle
    a10: Submit support applications whose deadline depends on registration
  stay:
    s1: Extend residence, mind the lead time
    s2: Meet support commitments, keep evidence
    s3: Build language level, check courses or scholarships
    s4: Family integration, clubs and school
    s5: Tax return in the first full year, check the income tax exemption
    s6: Mind the reporting duties for foreign pensions by 31 January
    s7: Have certificates and degrees recognised, if still open
    s8: Review the plan after twelve months, because rules change every year
rubrics:
  status-und-staatsangehoerigkeit:
    title: Status and citizenship
    intro: "Nothing can be decided before the status: it determines the residence route and access to work, school and support."
    q1: Do I get Croatian citizenship through my grandparents?
    q2: What is the certificate for emigrants and what does it give me?
    q3: May I keep two passports?
    t1: Descent
    t2: Naturalisation under the emigrant rule
    t3: Residence for emigrants and descendants
    t4: EU free movement
    t5: Work residence for third countries
    t6: Digital nomad
    t7: Family reunification
    t8: Extension
    t9: Dual citizenship
  dokumente-und-behoerden:
    title: Documents and authorities
    intro: "The OIB is the key to almost every application. Before it comes the document chain: original, apostille, certified translation, in that order."
    q1: What is the OIB and where do I get it?
    q2: How do I prove descent across three generations?
    q3: My name is spelled differently in the documents. What now?
    t1: OIB
    t2: Civil status certificates
    t3: Line of descent across generations
    t4: Apostille
    t5: Certified translation
    t6: Name discrepancies and spellings
    t7: Parish and civil registers
    t8: Domovnica
    t9: Identity card
    t10: e-Građani access
  das-bisherige-wohnland-verlassen:
    title: Leaving the previous country of residence
    intro: Deregistration, tax closure and the end of insurance in the country of origin have their own deadlines that have nothing to do with the Croatian procedure.
    q1: When do I deregister in Switzerland or Argentina?
    q2: Which documents must I secure before leaving?
    q3: What happens to my pension and my account?
    t1: Deregistration
    t2: Tax closure
    t3: End of insurance
    t4: Cancelling contracts
    t5: Securing pension records
    t6: Requesting school certificates
    t7: Bank account
    t8: Powers of attorney
  arbeit-und-qualifikation:
    title: Work and qualifications
    intro: Whether a degree must be recognised and how an employment contract is read in Croatia decides the first months.
    q1: Is my degree recognised in Croatia?
    q2: How much of the gross salary remains net?
    q3: Is my profession regulated?
    t1: Labour market
    t2: Job search
    t3: Understanding the employment contract
    t4: Gross and net
    t5: Recognition of academic degrees
    t6: Regulated professions
    t7: Employment rights
    t8: Partner's job search
    t9: Language at work
  unternehmen-gruenden:
    title: Founding and self-employment
    intro: Some support schemes require the application before founding. Whoever founds first and applies afterwards loses the entitlement.
    q1: Which legal form suits me?
    q2: What is the flat-rate trade?
    q3: Do I apply for support before or after founding?
    t1: Legal forms compared
    t2: Flat-rate trade
    t3: Bookkeeping duties
    t4: Contributions
    t5: Permits
    t6: Order relative to support schemes
    t7: Electronic invoicing
    t8: Ongoing duties
  steuern-geld-und-pension:
    title: Taxes, money and pension
    intro: Tax residency, double taxation and the crediting of foreign pensions are the topics where a Croatian professional must be consulted.
    q1: Where am I taxable if I move mid-year?
    q2: Is my foreign pension taxed in Croatia?
    q3: How do I open a bank account?
    t1: Tax residency
    t2: Double taxation
    t3: Five-year income tax exemption
    t4: Foreign income
    t5: Foreign pensions
    t6: Pension crediting
    t7: Social security agreements
    t8: Bank account
    t9: Money transfer
  gesundheit-und-pflege:
    title: Health and care
    intro: Insurance starts on a different day depending on the basis. Whoever does not plan the gap in advance is without cover in the first weeks.
    q1: From when am I health-insured in Croatia?
    q2: How do I bridge the time in between?
    q3: How do I find a family doctor or paediatrician?
    t1: Start of insurance by basis
    t2: Transitional cover
    t3: Supplementary insurance
    t4: Finding a family doctor and paediatrician
    t5: Medication
    t6: Pregnancy
    t7: Chronic illness
    t8: Care
    t9: Accessibility
  kinder-schule-und-ausbildung:
    title: Children, school and education
    intro: Enrolment, school district and language support depend on the residence registration. Certificates from abroad need their own procedure.
    q1: How do I enrol my child in school?
    q2: Are the certificates recognised?
    q3: Is there language support for children without Croatian?
    t1: Kindergarten
    t2: Enrolment
    t3: School district
    t4: Recognition of certificates
    t5: Language support
    t6: Special educational needs
    t7: Costs
    t8: Vocational training
    t9: University studies
    t10: Scholarships
  wohnen-und-regionen:
    title: Housing and regions
    intro: Year-round rentals are seasonally scarce in coastal regions. Inherited family land often has unresolved co-owners in the land register.
    q1: May I buy in Croatia as a foreigner?
    q2: What is in the land register and why does it matter?
    q3: How do I find a year-round rental on the coast?
    t1: Long-term rental
    t2: Seasonal availability
    t3: Deposit
    t4: Utilities
    t5: Pre-purchase check
    t6: Purchase by foreigners
    t7: Land register
    t8: Inherited family land
    t9: Unresolved co-owners
    t10: Legalisation
    t11: Building
    t12: Municipal housing
  sprache-und-gemeinschaft:
    title: Language and community
    intro: "Return rarely fails at registration, often at integration: language, clubs, people who take you along."
    q1: Where do I learn Croatian, online and locally?
    q2: Are there scholarships for language courses?
    q3: How do partner and children find their place?
    t1: Courses online and locally
    t2: Scholarships
    t3: Language levels
    t4: Everyday language
    t5: Clubs
    t6: Church
    t7: Sport
    t8: Mentoring
    t9: Integration of partner and children
  umzug-und-mobilitaet:
    title: Moving and mobility
    intro: Household goods, vehicle import and driving licence each have their own deadlines from registration. Transport is the smallest problem.
    q1: Are my household goods duty-free?
    q2: Can I take my car with me?
    q3: Do I have to exchange my driving licence?
