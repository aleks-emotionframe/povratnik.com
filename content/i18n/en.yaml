  about:
    title: "About us: povratnik.com"
    description: Who is behind povratnik.com, how we are financed, how we check and why paid services do not change content.
    hero: Understand, compare, arrive.
    lede: Authority websites each explain their own slice. Nobody explains in which order the slices belong together and what depends on what. That is exactly what we take off your hands.
    mission_title: Mission and independence
    mission_1: "povratnik.com is run by EmotionFrame GmbH in Switzerland. Orientation is free: general information, the basic profile of every municipality, factual corrections and neutral comparison data cost nothing and are never put behind a paywall."
    mission_2: "What is paid for is maintenance: municipalities that have their offers structured, translated and continuously checked, professional partners with a transparent profile, employers with current vacancies. A municipality that does not pay is not kept artificially incomplete. Paid services do not change results, there is no paid placement, and advertising is labelled."
    households_title: Households instead of individuals
    households_text: Partner and children can have different citizenships, residence routes and insurance bases. That is why for us the person is the planning unit and the household the frame.
    stay_title: Staying after arriving
    stay_text: "The first twelve months are part of the product: learning the language, changing school, integration, the partner's job search, extensions. Success does not end with registration."
    always_title: What always applies
    always_1: No paywall in front of core information
    always_2: No paid placement
    always_3: No ranking of municipalities
    always_4: No answers that leave the browser
    always_5: No rule without named professional approval
    check_title: How we check
    check_text: "Every statement is one of three kinds and is labelled as such: a finding with a named source and check date, a product rule we derive from it, or an open point that needs individual or official clarification. An offer that was not found is never presented as non-existent."
    hierarchy_title: Hierarchy of sources
    h1: Official legal publication in the original, read together with its amendments
    h2: Competent Croatian authority
    h3: Original municipal decision or call
    h4: Competent authority of the previous country of residence
    h5: Written professional information from an authority, with date and case assumptions
    h6: Professional publications and advisory articles
    h7: "Press and experience reports: context, never the basis of an entitlement"
    hierarchy_note: A lower tier never refutes a higher one. A press article is never evidence of a deadline, an amount or a requirement.
    cycles_title: Review cycles
    c1: Open funding calls
    c1_v: weekly while running
    c2: Residence, taxes, insurance
    c2_v: monthly review of changes
    c3: Municipal measures
    c3_v: quarterly and on decisions
    c4: Contacts and institutions
    c4_v: every six months
    cycles_note: A missed review date creates a warning, not silent reuse.
    roles_title: Who is responsible
    role_product: Product responsibility
    role_tech: Technical responsibility
    role_review: Professional review of law and taxes
    role_review_v: "Test stage: approves nothing. A Croatian professional is sought for the named approval of every legal rule."
    placeholder: Placeholder
    open: open
    role_editorial: Croatian-speaking editorial team
    role_errors: Error contact
    role_errors_v: review within two working days
    stage_title: Test stage
    stage_text: There is no professionally approved legal rule. The quick check runs with labelled example rules so that the portal can be tested. No result says anything about your actual situation. A review by an AI system does not replace a qualified independent professional.
