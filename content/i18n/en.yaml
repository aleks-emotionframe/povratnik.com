    t2: Customs and removal goods
    t3: Vehicle import
    t4: Driving licence exchange
    t5: Pets
    t6: Removal companies
    t7: Travel
    t8: Electricity, water, internet, telephone
  leistungen-und-foerderung:
    title: Benefits and support
    intro: The state, counties and municipalities support return, but in a fragmented way. Every measure here carries status, source and check date.
    q1: Which support schemes exist for returnees?
    q2: May I combine several measures?
    q3: Which commitments and repayment obligations exist?
