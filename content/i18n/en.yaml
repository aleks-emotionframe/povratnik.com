wizard:
  title: My way to Croatia
  intro: Six questions, then your first plan. Your answers stay in this browser.
  progress: Question {n} of {total}
  for_person: For {person}
  unknown: I do not know yet
  back: Back
  next: Next
  finish: Show plan
  restart: Start over
  remove: remove
  household_label: Household
  add: Add
  edit: Change
  print: Print as PDF
  no_js: The quick check needs JavaScript, because the evaluation runs in your browser and your answers are not sent anywhere. Please enable JavaScript or use another browser.
  no_rules_title: No approved rule
  no_rules_text: There is currently no professionally approved and published rule. The quick check therefore cannot produce a plan yet.
  synthetic_banner: Synthetic example rules
  synthetic_text: This plan is based on invented example rules without professional approval. It says nothing about your actual situation.
  roles:
    self: You
    partner: Partner
    child: Child
    other: Other person
  q:
    stage:
      title: Where are you right now?
      help: Anyone who has already entered Croatia first gets the running deadlines checked.
      options:
        exploring: I am still exploring
        planning: I am planning concretely
        arrived: I am already in Croatia
    household:
      title: Who is moving with you?
      help: Each person gets their own path. Your partner and child may have different requirements than you.
      options:
        alone: Just me
        partner: With my partner
        partner_children: With partner and children
        alone_children: Alone with children
        others: With other people
    country:
      title: Where does this person live today?
      help: Determines the document route, certification, translation and deregistration duties.
      options:
        ar: Argentina
        cl: Chile
        de: Germany
        ch: Switzerland
        at: Austria
        ca: Canada
        other: Other country
    citizenship:
      title: Which citizenships does this person hold?
      help: Multiple choice. The question is about citizenship, not the passport. An expired passport does not change citizenship.
      options:
        hr: Croatian
        eea: EU or EEA
        ch: Switzerland
        other: Other
        stateless: Stateless
    link:
      title: Is there a link to Croatia?
      help: A link opens routes through origin, without promising anything. Whether evidence suffices is decided by the authority.
      options:
        parent: A parent is or was Croatian
        ancestor: Grandparents or earlier ancestors were Croatian
        former_residence: Has lived in Croatia before
        partner: Partner with a Croatian link
        none: No link
    horizon:
      title: When should the move take place?
      help: Determines the order, not the content. A shared date is a scenario, not a fixed date.
      options:
        within_6_months: Within 6 months
        6_to_12_months: In 6 to 12 months
        later_or_unclear: Later or still unclear
    income:
      title: What will this person live on in Croatia?
      help: Activates questions on work, education and finances.
      options:
        employment: Employment in Croatia
        self_employment: Own business or start-up
        remote_employer_abroad: Work for an employer abroad
        pension_or_assets: Pension or assets
        study: Studies
    residence:
      title: Which residence status does this person have in Croatia?
      help: The status decides which rules apply at all. It is different from citizenship.
      options:
        eea_registered: Registered as an EU, EEA or Swiss citizen
        temporary_residence: Temporary residence (privremeni boravak)
        diaspora_certificate: Residence for emigrants and descendants
        digital_nomad: Digital nomad
        permanent_residence: Permanent residence (stalni boravak)
        long_term_residence: Long-term residence (dugotrajno boravište)
        none: No status yet
    entry:
      title: When did this person enter Croatia?
      help: The entry date triggers deadlines. Without a date, deadlines can only be calculated once it is confirmed.
  refine:
    unknown: I do not know
    children:
      title: "{person}: age and language"
      help: Affects school, language support and the timeline.
      age:
        label: Age
        0_5: 0 to 5 years
        6_14: 6 to 14 years
        15_18: 15 to 18 years
      croatian:
        label: Speaks Croatian
        "yes": Yes
        some: A little
        "no": No
    founding:
      title: Your start-up
      help: Affects eligibility for support and the order trap.
      sector:
        label: Sector according to the call
        allowed: Eligible sector
        excluded: Excluded sector (trade, transport, accommodation, catering, finance, real estate)
      founded:
        label: Already founded
        "yes": Yes
        "no": No
    place:
      title: Which municipality?
      help: Brings the municipal measures into the plan. Fictional test municipalities during the test stage.
      place:
        label: Destination
        none: No destination yet
    property:
      title: Housing at the destination
      help: Affects the land register, inheritance and purchase approval.
      property:
        label: Planned
        buy: Purchase
        rent: Rent
        inherited: Inherited family property
    pension:
      title: "{person}: pension"
      help: Affects crediting and taxation.
      pension:
        label: From which country
        ar: Argentina
        cl: Chile
        br: Brazil
        de: Germany
        ch: Switzerland
        at: Austria
        us: United States
        ca: Canada
        other: Other country
    regulated:
      title: "{person}: regulated profession"
      help: For example health, teaching and legal professions. Recognition is a separate preliminary step.
      regulated:
        label: Profession is regulated
        "yes": Yes
        "no": No
    care:
      title: Care and ongoing treatment
      help: Affects care at the destination and transitional cover.
      care:
        label: Ongoing medical need in the household
        "yes": Yes
        "no": No
