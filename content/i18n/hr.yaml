    t7: Kronična bolest
    t8: Njega
    t9: Pristupačnost
  kinder-schule-und-ausbildung:
    title: Djeca, škola i obrazovanje
    intro: Upis, školski okrug i jezična potpora ovise o prijavi prebivališta. Svjedodžbe iz inozemstva trebaju zaseban postupak.
    q1: Kako upisujem dijete u školu?
    q2: Priznaju li se svjedodžbe?
    q3: Postoji li jezična potpora za djecu bez hrvatskog?
    t1: Vrtić
    t2: Upis
    t3: Školski okrug
    t4: Priznavanje svjedodžbi
