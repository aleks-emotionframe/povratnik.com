  leistungen-und-foerderung:
    title: Mjere i potpore
    intro: Država, županije i općine potiču povratak, ali rascjepkano. Svaka mjera kod nas nosi stanje, izvor i datum provjere.
    q1: Koje potpore postoje za povratnike?
    q2: Smijem li kombinirati više mjera?
    q3: Koje obveze i obveze povrata postoje?
