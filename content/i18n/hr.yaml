situations:
  familie:
    title: Dolazim s obitelji
    intro: Partner i djeca mogu imati različita državljanstva i osnove osiguranja. Svaka osoba ima vlastiti put, kućanstvo je okvir.
    trap: Zdravstveno osiguranje djece ovisi o osnovi roditelja. Tko prazninu ne isplanira unaprijed, prvih je tjedana bez pedijatra.
  selbstaendig:
    title: Želim osnovati djelatnost
    intro: Neke potpore zahtijevaju zahtjev prije osnivanja, druge unutar nekoliko dana nakon njega. Redoslijed odlučuje o pravu.
    trap: Prvo osnovati, pa čitati. Tko prijavi djelatnost i zahtjev podnese prekasno, izgubio je potporu za povratnike.
  pensioniert:
    title: U mirovini sam
    intro: Mirovina iz inozemstva, zdravstveno osiguranje bez poslodavca, dvostruko oporezivanje. Kod poreza i socijalnog osiguranja treba uključiti hrvatskog stručnjaka.
    trap: Sa SAD-om, Argentinom i Brazilom ne postoji ugovor o izbjegavanju dvostrukog oporezivanja. Mirovine iz tih država prijavljuju se do 31.1. za prethodnu godinu.
  ohne-pass:
    title: Nemam hrvatsku putovnicu
    intro: "Bez hrvatskog državljanstva sve ovisi o boravišnom putu: sloboda kretanja za EU, EGP i Švicarsku, potvrda za potomke iseljenika, inače boravak radi rada ili digitalni nomad."
    trap: Zamijeniti potvrdu za iseljenike sa stjecanjem državljanstva. Ona je boravišni put i može teći usporedno s postupkom za državljanstvo.
  allein:
    title: Dolazim sam
    intro: "Najkraći put: status, OIB, prijava, osiguranje. Nakon toga važno je uključivanje, jer ondje povratak najčešće propada."
    trap: Petu fazu, ostanak, svi izostavljaju. Jezik, udruge i ljudi koji vas povedu od početka spadaju u plan.
  arbeitgeber-im-ausland:
    title: Radim za poslodavca u inozemstvu
    intro: Tko iz Hrvatske radi za poslodavca u inozemstvu, ovisno o državljanstvu treba drukčiji boravišni put, a porezno pitanje nije trivijalno.
    trap: Porezna rezidentnost nakon 183 dana. Tko se seli tijekom godine, možda je porezni obveznik u dvije države. To razjašnjava porezni stručnjak, ne ova stranica.
cases:
  familie:
    name: Lucía
    place: Buenos Aires
    line: Pradjedovi iz Dalmacije, bez hrvatske putovnice, partner bez veze, jedno dijete školske dobi.
    shapes: Status je otvoren, a lanac isprava kroz četiri generacije najdulji je pojedinačni korak. Njezin partner ide potpuno drugim putem.
    first: Dati provjeriti može li se lanac podrijetla potpuno dokazati. Ne zdravstveno osiguranje koje je tražila.
  selbstaendig:
    name: Marko
    place: Stuttgart
    line: Hrvatska putovnica, partnerica također, dvoje djece, želi postati samostalan.
    shapes: Status je razjašnjen, put je kratak. Odlučujući su redoslijed između zahtjeva za potporu i osnivanja te to da oslobođenje od poreza kod samostalne djelatnosti možda uopće ne vrijedi.
    first: Pročitati važeći javni poziv prije nego što se išta prijavi.
  arbeitgeber-im-ausland:
    name: Anna
    place: Beč
    line: Građanka EU-a bez hrvatskih korijena, sama, iz Hrvatske radi za austrijskog poslodavca.
    shapes: "Boravak nije kompliciran. Njezin je rizik porezni: rezidentnost, dvostruko oporezivanje i socijalno osiguranje pri radu za inozemnog poslodavca, s povratnim učinkom."
    first: Ovo razjasniti prije selidbe, ne poslije.
  pensioniert:
    name: Ivan
    place: Toronto
    line: Hrvatska putovnica, partnerica bez nje, živi od kanadske mirovine, selidba otvorena.
    shapes: Njegova partnerica ide drugim putem od njega. Zdravstveno osiguranje kod njega ne proizlazi iz zaposlenja; ondje nastaju praznine. Potpore za povratnike za rad i osnivanje na njega se ne odnose.
    first: Razjasniti priznavanje mirovinskog staža i osnovu osiguranja, uz ugovor između Kanade i Hrvatske.
