checklists:
  arrive:
    a1: Prijaviti prebivalište ili boravište u policijskoj upravi, zabilježiti datum
    a2: Predočiti ili zatražiti OIB za svaku osobu
    a3: Urediti zdravstveno osiguranje u HZZO-u, provjeriti dopunsko osiguranje
    a4: Otvoriti bankovni račun
    a5: Upisati djecu u vrtić ili školu
    a6: Pronaći liječnika opće prakse i pedijatra, potvrditi upis
    a7: Prijaviti struju, vodu, internet, telefon
    a8: Zamijeniti vozačku dozvolu, paziti na rok od ulaska
    a9: Uvesti i registrirati vozilo
    a10: Podnijeti zahtjeve za potpore čiji rok ovisi o prijavi
  stay:
    s1: Produljiti boravak, paziti na rok za podnošenje
    s2: Ispunjavati obveze iz potpora, čuvati dokaze
    s3: Graditi razinu jezika, provjeriti tečaj ili stipendiju
    s4: Uključivanje obitelji, udruge i škola
    s5: Porezna prijava u prvoj punoj godini, provjeriti oslobođenje od poreza
    s6: Paziti na obveze prijave inozemnih mirovina do 31.1.
    s7: Dati priznati svjedodžbe i diplome, ako je još otvoreno
    s8: Nakon dvanaest mjeseci ponovno provjeriti plan, jer se pravila mijenjaju svake godine
