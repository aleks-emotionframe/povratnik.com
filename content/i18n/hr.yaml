    t7: Elektronički račun
    t8: Tekuće obveze
  steuern-geld-und-pension:
    title: Porezi, novac i mirovina
    intro: Porezna rezidentnost, dvostruko oporezivanje i priznavanje inozemnih mirovina teme su kod kojih treba uključiti hrvatskog stručnjaka.
    q1: Gdje sam porezni obveznik ako se selim usred godine?
    q2: Oporezuje li se moja inozemna mirovina u Hrvatskoj?
    q3: Kako otvaram bankovni račun?
    t1: Porezna rezidentnost
    t2: Dvostruko oporezivanje
    t3: Petogodišnje oslobođenje od poreza na dohodak
    t4: Inozemni prihodi
    t5: Inozemne mirovine
    t6: Priznavanje mirovinskog staža
    t7: Ugovori o socijalnom osiguranju
    t8: Bankovni račun
    t9: Prijenos novca
  gesundheit-und-pflege:
    title: Zdravlje i njega
    intro: Osiguranje počinje ovisno o osnovi na drugi dan. Tko ne isplanira prazninu unaprijed, prvih je tjedana bez pokrića.
    q1: Od kada sam zdravstveno osiguran u Hrvatskoj?
    q2: Kako premostiti vrijeme između?
    q3: Kako pronaći liječnika opće prakse ili pedijatra?
    t1: Početak osiguranja prema osnovi
    t2: Prijelazno pokriće
    t3: Dopunsko osiguranje
