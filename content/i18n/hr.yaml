    t8: Strukovno obrazovanje
    t9: Studij
    t10: Stipendije
  wohnen-und-regionen:
    title: Stanovanje i regije
    intro: Dugoročni najam u obalnim je regijama sezonski oskudan. Naslijeđeno obiteljsko zemljište često ima neraščišćene suvlasnike u zemljišnim knjigama.
    q1: Smijem li kao stranac kupovati u Hrvatskoj?
    q2: Što piše u zemljišnim knjigama i zašto je to važno?
    q3: Kako pronaći godišnji najam na obali?
    t1: Dugoročni najam
    t2: Sezonska dostupnost
    t3: Polog
    t4: Režije
