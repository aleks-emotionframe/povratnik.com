    title: Jezik i zajednica
    intro: "Povratak rijetko propada na prijavi, često na uključivanju: jezik, udruge, ljudi koji vas povedu."
    q1: Gdje učim hrvatski, online i uživo?
    q2: Postoje li stipendije za jezične tečajeve?
    q3: Kako se partner i djeca uključuju?
    t1: Tečajevi online i uživo
