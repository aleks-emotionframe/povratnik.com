  about:
    title: "O nama: povratnik.com"
    description: Tko stoji iza povratnik.com, kako se financiramo, kako provjeravamo i zašto plaćene usluge ne mijenjaju sadržaje.
    hero: Razumjeti, usporediti, doći.
    lede: Stranice tijela objašnjavaju svaka svoj isječak. Nitko ne objašnjava kojim redoslijedom isječci idu zajedno i što o čemu ovisi. Upravo to preuzimamo mi.
    mission_title: Zadaća i neovisnost
    mission_1: "povratnik.com vodi EmotionFrame GmbH u Švicarskoj. Orijentacija je besplatna: opće informacije, osnovni profil svake općine, činjenične ispravke i neutralni usporedni podaci ne koštaju ništa i nikad se ne stavljaju iza naplate."
    mission_2: "Plaćaju se usluge održavanja: općine koje daju strukturirano pripremiti, prevesti i stalno provjeravati svoje ponude, stručni partneri s transparentnim profilom, poslodavci s aktualnim radnim mjestima. Općina koja ne plaća ne drži se umjetno nepotpunom. Plaćene usluge ne mijenjaju stručne rezultate, nema plaćenog pozicioniranja, a oglašavanje se označava."
    households_title: Kućanstva umjesto pojedinaca
    households_text: Partner i djeca mogu imati različita državljanstva, boravišne putove i osnove osiguranja. Zato je kod nas osoba jedinica planiranja, a kućanstvo okvir.
    stay_title: Ostati nakon dolaska
    stay_text: "Prvih dvanaest mjeseci dio je proizvoda: učenje jezika, promjena škole, uključivanje, traženje posla partnera, produljenja. Uspjeh ne završava prijavom."
    always_title: Što uvijek vrijedi
    always_1: Bez naplate ispred ključnih informacija
    always_2: Bez plaćenog pozicioniranja
    always_3: Bez rang-liste općina
    always_4: Nijedan odgovor ne napušta preglednik
    always_5: Nijedno pravilo bez poimeničnog stručnog odobrenja
    check_title: Kako provjeravamo
    check_text: "Svaka je izjava jedna od tri vrste i tako se označava: nalaz s navedenim izvorom i datumom provjere, pravilo proizvoda koje iz njega izvodimo, ili otvorena točka koja treba razjašnjenje pojedinačnog slučaja ili tijela. Nepronađena ponuda nikad se ne prikazuje kao nepostojeća."
    hierarchy_title: Hijerarhija izvora
    h1: Službena pravna objava u izvorniku, čitana sa svojim izmjenama
    h2: Nadležno hrvatsko tijelo
    h3: Izvorna općinska odluka ili natječaj
    h4: Nadležno tijelo dosadašnje države stanovanja
