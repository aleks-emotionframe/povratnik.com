  about:
    title: "Über uns: povratnik.com"
    description: Wer hinter povratnik.com steht, wie wir finanziert werden, wie wir prüfen und warum bezahlte Leistungen keine Inhalte verändern.
    hero: Verstehen, vergleichen, ankommen.
    lede: Behördenseiten erklären jeweils ihren eigenen Ausschnitt. Niemand erklärt, in welcher Reihenfolge die Ausschnitte zusammengehören und was wovon abhängt. Genau das nehmen wir Ihnen ab.
    mission_title: Auftrag und Unabhängigkeit
    mission_1: "povratnik.com wird von der EmotionFrame GmbH in der Schweiz betrieben. Die Orientierung ist frei: allgemeine Informationen, das Basisprofil jeder Gemeinde, sachliche Korrekturen und neutrale Vergleichsdaten kosten nichts und werden nie hinter eine Bezahlschranke gestellt."
    mission_2: "Bezahlt werden Pflegeleistungen: Gemeinden, die ihre Angebote strukturiert aufbereiten, übersetzen und laufend prüfen lassen, Fachpartner mit einem transparenten Profil, Arbeitgeber mit aktuellen Stellen. Eine Gemeinde, die nichts bezahlt, wird nicht künstlich unvollständig gehalten. Bezahlte Leistungen verändern keine fachlichen Ergebnisse, es gibt keine bezahlte Platzierung, und Werbung wird gekennzeichnet."
    households_title: Haushalte statt Einzelpersonen
    households_text: Partner und Kinder können unterschiedliche Staatsangehörigkeiten, Aufenthaltswege und Versicherungsgrundlagen haben. Deshalb ist bei uns die Person die Planungseinheit und der Haushalt die Klammer.
    stay_title: Bleiben nach dem Ankommen
    stay_text: "Die ersten zwölf Monate gehören zum Produkt: Spracherwerb, Schulwechsel, Anschluss, Arbeitssuche des Partners, Verlängerungen. Erfolg endet nicht mit der Anmeldung."
    always_title: Was immer gilt
    always_1: Keine Bezahlschranke vor Kerninformationen
    always_2: Keine bezahlte Platzierung
    always_3: Keine Rangliste von Gemeinden
    always_4: Keine Antworten, die den Browser verlassen
    always_5: Keine Regel ohne namentliche Fachfreigabe
    check_title: Wie wir prüfen
    check_text: "Jede Aussage ist eine von drei Arten und wird so gekennzeichnet: ein Befund mit benannter Quelle und Prüfdatum, eine Produktregel, die wir daraus ableiten, oder ein offener Punkt, der eine Einzelfall- oder Behördenklärung braucht. Ein nicht gefundenes Angebot wird nie als nicht existent ausgewiesen."
    hierarchy_title: Quellenhierarchie
    h1: Amtliche Rechtsveröffentlichung im Original, mit ihren Änderungen gelesen
    h2: Zuständige kroatische Behörde
    h3: Kommunaler Originalbeschluss oder Ausschreibung
    h4: Zuständige Behörde des bisherigen Wohnlands
    h5: Schriftliche Fachauskunft einer Behörde, mit Datum und Fallannahmen
    h6: Fachpublikationen und Beratungsbeiträge
    h7: "Presse und Erfahrungsberichte: Kontext, nie Anspruchsgrundlage"
    hierarchy_note: Eine niedrigere Stufe widerlegt nie eine höhere. Ein Presseartikel ist nie Beleg für eine Frist, einen Betrag oder eine Voraussetzung.
