# Oberflächentexte des Kurzchecks und des Plans (wizard-konzept.md 2.2 und 6).
wizard:
  title: Mein Weg nach Kroatien
  intro: Sechs Fragen, dann Ihr erster Plan. Ihre Antworten bleiben in diesem Browser.
  progress: Frage {n} von {total}
  for_person: Für {person}
  unknown: Weiss ich noch nicht
  back: Zurück
  next: Weiter
  finish: Plan anzeigen
  restart: Von vorn beginnen
  remove: entfernen
  household_label: Haushalt
  add: Hinzufügen
  edit: Ändern
  print: Als PDF drucken
  no_js: Der Kurzcheck braucht JavaScript, weil die Auswertung in Ihrem Browser läuft und Ihre Antworten nirgendwohin übertragen werden. Bitte aktivieren Sie JavaScript oder nutzen Sie einen anderen Browser.
  no_rules_title: Keine freigegebene Regel
  no_rules_text: Es gibt derzeit keine fachlich freigegebene und veröffentlichte Regel. Der Kurzcheck kann deshalb noch keinen Plan erzeugen.
  synthetic_banner: Synthetische Beispielregeln
  synthetic_text: Dieser Plan beruht auf erfundenen Beispielregeln ohne fachliche Freigabe. Er trifft keine Aussage über Ihre tatsächliche Lage.
  roles:
    self: Sie
    partner: Partnerin oder Partner
    child: Kind
    other: Weitere Person
  q:
    stage:
      title: Wo stehen Sie gerade?
      help: Wer bereits eingereist ist, bekommt zuerst die laufenden Fristen geprüft.
      options:
        exploring: Ich erkunde noch
        planning: Ich plane konkret
        arrived: Ich bin bereits in Kroatien
    household:
      title: Wer zieht mit?
      help: Jede Person bekommt einen eigenen Weg. Partnerin und Kind können andere Voraussetzungen haben als Sie.
      options:
        alone: Ich allein
        partner: Mit Partnerin oder Partner
        partner_children: Mit Partner und Kindern
        alone_children: Allein mit Kindern
        others: Mit weiteren Personen
    country:
      title: Wo lebt diese Person heute?
      help: Bestimmt Dokumentenweg, Beglaubigung, Übersetzung und Abmeldepflichten.
      options:
        ar: Argentinien
        cl: Chile
        de: Deutschland
        ch: Schweiz
        at: Österreich
        ca: Kanada
        other: Anderes Land
    citizenship:
      title: Welche Staatsangehörigkeiten hat diese Person?
      help: Mehrfachauswahl. Gefragt ist die Staatsangehörigkeit, nicht der Pass. Ein abgelaufener Pass ändert nichts an der Staatsangehörigkeit.
      options:
        hr: Kroatisch
        eea: EU oder EWR
        ch: Schweiz
        other: Andere
        stateless: Staatenlos
    link:
      title: Besteht ein Bezug zu Kroatien?
      help: Der Bezug öffnet Wege über die Herkunft, ohne etwas zu versprechen. Ob ein Nachweis ausreicht, entscheidet die Behörde.
      options:
        parent: Ein Elternteil ist oder war kroatisch
        ancestor: Grosseltern oder frühere Vorfahren waren kroatisch
        former_residence: Hat früher selbst in Kroatien gelebt
        partner: Partnerin oder Partner mit kroatischem Bezug
        none: Kein Bezug
    horizon:
      title: Wann soll der Umzug stattfinden?
      help: Bestimmt die Reihenfolge, nicht den Inhalt. Ein gemeinsamer Termin ist ein Szenario, kein Datum.
      options:
        within_6_months: In bis zu 6 Monaten
        6_to_12_months: In 6 bis 12 Monaten
        later_or_unclear: Später oder noch unklar
    income:
      title: Wovon lebt diese Person in Kroatien?
      help: Aktiviert Erwerbs-, Bildungs- und Finanzfragen.
      options:
        employment: Anstellung in Kroatien
        self_employment: Eigene Tätigkeit oder Gründung
        remote_employer_abroad: Arbeit für einen Arbeitgeber im Ausland
        pension_or_assets: Rente oder Vermögen
        study: Studium
    residence:
      title: Welchen Aufenthaltsstatus hat diese Person in Kroatien?
      help: Der Status entscheidet, welche Regeln überhaupt gelten. Er ist etwas anderes als die Staatsangehörigkeit.
      options:
        eea_registered: Als EU-, EWR- oder Schweizer Bürger registriert
        temporary_residence: Vorübergehender Aufenthalt (privremeni boravak)
        diaspora_certificate: Aufenthalt für Auswanderer und Nachkommen
        digital_nomad: Digitale Nomadin oder digitaler Nomade
        permanent_residence: Dauerhafter Aufenthalt (stalni boravak)
        long_term_residence: Langfristiger Aufenthalt (dugotrajno boravište)
        none: Noch kein Status
    entry:
      title: Wann ist diese Person eingereist?
      help: Das Einreisedatum löst Fristen aus. Ohne Datum sind Fristen erst berechenbar, wenn es bestätigt ist.
  # Vertiefende Fragen (wizard-konzept.md 2.3, lib/refine.ts). Freiwillig, nach der Zusammenfassung.
  refine:
    unknown: Weiss ich nicht
    children:
      title: "{person}: Alter und Sprache"
      help: Wirkt auf Schule, Sprachförderung und Zeitplan.
      age:
        label: Alter
        0_5: 0 bis 5 Jahre
        6_14: 6 bis 14 Jahre
        15_18: 15 bis 18 Jahre
      croatian:
        label: Spricht Kroatisch
        "yes": Ja
        some: Etwas
        "no": Nein
    founding:
      title: Ihre Gründung
      help: Wirkt auf Förderfähigkeit und die Reihenfolgefalle.
      sector:
        label: Branche laut Förderaufruf
        allowed: Zugelassene Branche
        excluded: Ausgeschlossene Branche (Handel, Transport, Beherbergung, Gastronomie, Finanzen, Immobilien)
      founded:
        label: Bereits gegründet
        "yes": Ja
        "no": Nein
    place:
      title: Welche Gemeinde?
      help: Blendet die kommunalen Leistungen in den Plan ein. Auf der Teststufe fiktive Testgemeinden.
      place:
        label: Zielort
        none: Noch kein Zielort
    property:
      title: Wohnen am Zielort
      help: Wirkt auf Grundbuch, Erbschaft und Kaufgenehmigung.
      property:
        label: Geplant ist
        buy: Kauf
        rent: Miete
        inherited: Geerbtes Familieneigentum
    pension:
      title: "{person}: Rente"
      help: Wirkt auf Anrechnung und Besteuerung.
      pension:
        label: Aus welchem Land
        ar: Argentinien
        cl: Chile
        br: Brasilien
        de: Deutschland
        ch: Schweiz
        at: Österreich
        us: USA
        ca: Kanada
        other: Anderes Land
    regulated:
      title: "{person}: Reglementierter Beruf"
      help: Etwa Gesundheits-, Lehr- und Rechtsberufe. Die Anerkennung ist ein eigener Vorschritt.
      regulated:
        label: Beruf ist reglementiert
        "yes": Ja
        "no": Nein
    care:
      title: Pflege und laufende Behandlung
      help: Wirkt auf Versorgung am Zielort und Übergangsdeckung.
      care:
        label: Laufender medizinischer Bedarf im Haushalt
        "yes": Ja
        "no": Nein
