# Produktregeln der Zusammenfassung (lib/summary.ts): Einordnung, keine Prüfung.
summary:
  different:
    status_unknown: "Bei {person} ist die Staatsangehörigkeit noch offen. Vor dem Status ist nichts entscheidbar, deshalb steht die Klärung an erster Stelle."
    mixed_household: Nicht alle Personen in Ihrem Haushalt haben dieselbe Staatsangehörigkeit. Jede Person geht deshalb einen eigenen Weg, und die Fristen laufen getrennt.
    arrived: Sie sind bereits in Kroatien. Fristen laufen ab Einreise und Anmeldung, nicht ab dem Tag, an dem Sie diese Seite lesen.
    self_employed_tax: Sie planen eine eigene Tätigkeit. Die fünfjährige Lohnsteuerbefreiung gilt für Löhne aus unselbständiger Arbeit; ob und wie sie bei Ihnen greift, klärt eine Steuerfachperson.
    remote: Arbeit für einen Arbeitgeber im Ausland. Der Aufenthaltsweg hängt von der Staatsangehörigkeit ab, die Steuerfrage von der Ansässigkeit. Beides ist kein Standardfall.
    children: Kinder im Haushalt. Schule und Kinderarzt hängen an Wohnsitz und Versicherung der Eltern; die Reihenfolge der Eltern bestimmt die der Kinder.
    already_founded: Sie haben bereits gegründet. Manche Förderungen verlangen den Antrag vor oder kurz nach der Gründung; ob eine Frist noch offen ist, gehört sofort geprüft.
  chain:
    status: Status
    oib: OIB
    registration: Anmeldung
    insurance: Versicherung
    clear: geklärt
    open: zu klären
    next: folgt
    bottleneck: Engstelle
  clarify:
    founded_deadline: "Bereits gegründet: Ob die Antragsfrist von Biram Hrvatsku (30 Tage nach der Selbstbeschäftigung) noch offen ist, sofort bei der HZZ klären."
    sector_excluded: Ihre Branche gehört nach Ihren Angaben zu den ausgeschlossenen. Ob eine Ausnahme greift, entscheidet die HZZ anhand des aktuellen Aufrufs.
    sector_unknown: Ob Ihre Branche förderfähig ist, steht im aktuellen Aufruf der HZZ. Vor der Gründung prüfen.
    regulated: "Anerkennung des Berufs ({person}): eigener Vorschritt über die zuständige Kammer (PISK). Welche Kammer, hängt vom Beruf ab."
    care: "Laufender medizinischer Bedarf: Versorgung am Zielort und Übergangsdeckung vor der Abreise klären, bei der HZZO und der Praxis vor Ort."
    inherited: "Geerbtes Familieneigentum: Grundbuchstand und Miteigentümer vor jedem Schritt durch eine Anwältin oder einen Anwalt in Kroatien prüfen lassen."
    buy: "Immobilienkauf: Ob Sie als Ausländer kaufen dürfen und ob Gegenseitigkeit besteht, entscheidet das Justizministerium."
    child_language: "Sprachförderung ({person}): Angebot und Zuständigkeit hängen vom Schulbezirk ab; bei der Schule am Zielort erfragen."
    pension_no_agreement: "Rente ({person}): Mit diesem Land besteht kein Doppelbesteuerungsabkommen. Meldepflicht und Besteuerung mit einer Steuerfachperson klären."
# Ankommens- und Bleibeliste (inhaltskonzept.md 6.2 E und F), abhakbar im Plan.
checklists:
  arrive:
    a1: Wohnsitz oder Aufenthalt bei der Polizeiverwaltung anmelden, Datum notieren
    a2: OIB für jede Person vorlegen oder beantragen
    a3: Krankenversicherung bei der HZZO regeln, Zusatzversicherung prüfen
    a4: Bankkonto eröffnen
    a5: Kinder in Kindergarten oder Schule einschreiben
    a6: Hausarzt und Kinderarzt finden, Aufnahme bestätigen lassen
    a7: Strom, Wasser, Internet, Telefon anmelden
    a8: Führerschein umschreiben, Frist ab Einreise beachten
    a9: Fahrzeug einführen und anmelden
    a10: Förderanträge stellen, deren Frist an der Anmeldung hängt
  stay:
    s1: Aufenthalt verlängern, Vorlauffrist beachten
    s2: Förderbindungen einhalten, Nachweise aufbewahren
    s3: Sprachniveau aufbauen, Kurs oder Stipendium prüfen
    s4: Anschluss der Familie, Vereine und Schule
    s5: Steuererklärung im ersten vollen Jahr, Lohnsteuerbefreiung prüfen
    s6: Meldepflichten für Auslandsrenten bis 31.1. beachten
    s7: Zeugnisse und Abschlüsse anerkennen lassen, falls noch offen
    s8: Nach zwölf Monaten den Plan erneut prüfen, weil sich Regeln jährlich ändern
