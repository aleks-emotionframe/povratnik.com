situations:
  familie:
    title: Vengo con mi familia
    intro: La pareja y los hijos pueden tener nacionalidades y bases de seguro distintas. Cada persona tiene su propio camino, el hogar es el marco.
    trap: El seguro de salud de los hijos depende de la base de los padres. Quien no planifica la laguna se queda las primeras semanas sin pediatra.
  selbstaendig:
    title: Quiero emprender
    intro: Algunas ayudas exigen la solicitud antes de la constitución, otras pocos días después. El orden decide el derecho.
    trap: Primero constituir, luego leer. Quien registra la actividad y presenta la solicitud demasiado tarde ha perdido la ayuda al regreso.
  pensioniert:
    title: Estoy jubilado
    intro: Pensión del extranjero, seguro de salud sin empleador, doble imposición. En impuestos y seguridad social hay que consultar a un profesional croata.
    trap: Con Estados Unidos, Argentina y Brasil no existe convenio de doble imposición. Las pensiones de estos países deben declararse hasta el 31.1. por el año anterior.
  ohne-pass:
    title: No tengo pasaporte croata
    intro: "Sin nacionalidad croata todo depende de la vía de residencia: libre circulación para UE, EEE y Suiza, certificado para descendientes de emigrantes, si no residencia por trabajo o nómada digital."
    trap: Confundir el certificado para emigrantes con la naturalización. Es una vía de residencia y puede correr en paralelo al procedimiento de nacionalidad.
  allein:
    title: Vengo solo
    intro: "El camino más corto: estatus, OIB, registro, seguro. Después cuenta la integración, porque ahí es donde más a menudo fracasa el regreso."
    trap: La quinta fase, quedarse, la omiten todos. El idioma, las asociaciones y las personas que le acompañan deben estar en el plan desde el principio.
  arbeitgeber-im-ausland:
    title: Trabajo para un empleador en el extranjero
    intro: Quien trabaja desde Croacia para un empleador en el extranjero necesita, según la nacionalidad, otra vía de residencia, y la cuestión fiscal no es trivial.
    trap: Residencia fiscal a partir de 183 días. Quien se muda a lo largo del año puede tener que tributar en dos países. Eso lo aclara un asesor fiscal, no esta web.
cases:
  familie:
    name: Lucía
    place: Buenos Aires
    line: Bisabuelos de Dalmacia, sin pasaporte croata, pareja sin vínculo, un hijo en edad escolar.
    shapes: El estatus está abierto, y la cadena de documentos a lo largo de cuatro generaciones es el paso individual más largo. Su pareja sigue un camino completamente distinto.
    first: Hacer comprobar si la cadena de ascendencia se puede documentar por completo. No el seguro de salud que había buscado.
  selbstaendig:
    name: Marko
    place: Stuttgart
    line: Pasaporte croata, la pareja también, dos hijos, quiere trabajar por cuenta propia.
    shapes: El estatus está aclarado, el camino es corto. Lo decisivo es el orden entre solicitud de ayuda y constitución, y que la exención del impuesto sobre el salario quizá no se aplique por cuenta propia.
    first: Leer la convocatoria vigente antes de registrar nada.
  arbeitgeber-im-ausland:
    name: Anna
    place: Viena
    line: Ciudadana de la UE sin raíces croatas, sola, trabaja desde Croacia para un empleador austriaco.
    shapes: "La residencia no es complicada. Su riesgo es fiscal: residencia fiscal, doble imposición y seguridad social al trabajar para un empleador extranjero, con efecto retroactivo."
    first: Aclarar este punto antes de la mudanza, no después.
  pensioniert:
    name: Ivan
    place: Toronto
    line: Pasaporte croata, pareja sin él, vive de una pensión canadiense, mudanza sin fecha.
    shapes: Su pareja sigue un camino distinto al suyo. En su caso el seguro de salud no deriva de un empleo; ahí surgen lagunas. Las ayudas al regreso para trabajo y emprendimiento no se aplican a él.
    first: Aclarar el cómputo de la pensión y la base del seguro, con el convenio entre Canadá y Croacia.
