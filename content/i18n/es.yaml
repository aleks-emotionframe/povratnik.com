summary:
  different:
    status_unknown: "La nacionalidad de {person} todavía está abierta. Antes del estatus no se puede decidir nada; por eso la aclaración va primero."
    mixed_household: No todas las personas de su hogar tienen la misma nacionalidad. Cada persona sigue su propio camino y los plazos corren por separado.
    arrived: Ya está en Croacia. Los plazos corren desde la entrada y el registro, no desde el día en que lee esta página.
    self_employed_tax: Planea una actividad propia. La exención de cinco años del impuesto sobre el salario se aplica a sueldos por cuenta ajena; si y cómo se aplica en su caso lo aclara un asesor fiscal.
    remote: Trabajo para un empleador en el extranjero. La vía de residencia depende de la nacionalidad, la cuestión fiscal de la residencia fiscal. Ninguna de las dos es un caso estándar.
    children: Hijos en el hogar. La escuela y el pediatra dependen del domicilio y del seguro de los padres; el orden de los padres marca el de los hijos.
    already_founded: Ya ha constituido su negocio. Algunas ayudas exigen la solicitud antes o poco después de la constitución; si un plazo sigue abierto hay que comprobarlo de inmediato.
  chain:
    status: Estatus
    oib: OIB
    registration: Registro
    insurance: Seguro
    clear: aclarado
    open: por aclarar
    next: sigue
    bottleneck: cuello de botella
  clarify:
    founded_deadline: "Ya constituido: comprobar de inmediato en el HZZ si el plazo de solicitud de Biram Hrvatsku (30 días tras el inicio de la actividad) sigue abierto."
    sector_excluded: Según sus datos, su sector está entre los excluidos. Si se aplica una excepción lo decide el HZZ según la convocatoria vigente.
    sector_unknown: Si su sector es elegible está en la convocatoria vigente del HZZ. Compruébelo antes de constituir.
    regulated: "Reconocimiento de la profesión ({person}): paso previo propio a través del colegio competente (PISK). Qué colegio, depende de la profesión."
    care: "Necesidad médica continua: aclarar antes de partir la atención en el destino y la cobertura transitoria, con el HZZO y la consulta local."
    inherited: "Propiedad familiar heredada: antes de cualquier paso, que un abogado en Croacia revise el registro de la propiedad y los copropietarios."
    buy: "Compra de inmueble: si puede comprar como extranjero y si existe reciprocidad lo decide el Ministerio de Justicia."
    child_language: "Apoyo lingüístico ({person}): la oferta y la competencia dependen del distrito escolar; pregunte en la escuela del destino."
    pension_no_agreement: "Jubilación ({person}): con este país no existe convenio de doble imposición. Aclarar la obligación de declarar y la tributación con un asesor fiscal."
checklists:
  arrive:
    a1: Registrar el domicilio o la residencia en la administración policial, anotar la fecha
    a2: Presentar o solicitar el OIB de cada persona
    a3: Regular el seguro de salud en el HZZO, comprobar el seguro complementario
    a4: Abrir una cuenta bancaria
    a5: Inscribir a los hijos en la guardería o la escuela
    a6: Encontrar médico de cabecera y pediatra, confirmar la admisión
    a7: Dar de alta electricidad, agua, internet y teléfono
    a8: Canjear el permiso de conducir, respetar el plazo desde la entrada
    a9: Importar y matricular el vehículo
    a10: Presentar las solicitudes de ayuda cuyo plazo depende del registro
  stay:
    s1: Prorrogar la residencia, respetar el plazo de antelación
    s2: Cumplir los compromisos de las ayudas, conservar los justificantes
    s3: Mejorar el nivel de idioma, comprobar cursos o becas
    s4: Integración de la familia, asociaciones y escuela
    s5: Declaración de la renta en el primer año completo, comprobar la exención del impuesto sobre el salario
    s6: Respetar las obligaciones de declarar pensiones extranjeras hasta el 31.1.
    s7: Hacer reconocer certificados y títulos, si sigue pendiente
    s8: Revisar el plan a los doce meses, porque las reglas cambian cada año
rubrics:
  status-und-staatsangehoerigkeit:
    title: "Estatus y nacionalidad"
    intro: "Antes del estatus no se puede decidir nada: determina la vía de residencia, el acceso al trabajo, a la escuela y a las ayudas."
    q1: ¿Obtengo la nacionalidad croata a través de mis abuelos?
    q2: ¿Qué es el certificado para emigrantes y para qué me sirve?
    q3: ¿Puedo conservar dos pasaportes?
    t1: Ascendencia
    t2: Naturalización por la regla de emigrantes
    t3: Residencia para emigrantes y descendientes
    t4: Libre circulación en la UE
    t5: Residencia por trabajo para terceros países
    t6: Nómada digital
    t7: Reagrupación familiar
    t8: Prórroga
    t9: Doble nacionalidad
  dokumente-und-behoerden:
    title: Documentos y administración
    intro: "El OIB es la llave de casi cualquier trámite. Antes viene la cadena de documentos: original, apostilla, traducción jurada, en ese orden."
    q1: ¿Qué es el OIB y dónde lo obtengo?
    q2: ¿Cómo demuestro la ascendencia a lo largo de tres generaciones?
    q3: Mi nombre está escrito de forma distinta en los documentos. ¿Y ahora?
    t1: OIB
    t2: Certificados del registro civil
    t3: Cadena de ascendencia a lo largo de generaciones
    t4: Apostilla
    t5: Traducción jurada
    t6: Diferencias y grafías de nombres
    t7: Libros parroquiales y registros
    t8: Domovnica
    t9: Documento de identidad
    t10: Acceso e-Građani
  das-bisherige-wohnland-verlassen:
    title: Dejar el país de residencia anterior
    intro: La baja, el cierre fiscal y el fin del seguro en el país de origen tienen plazos propios que no tienen nada que ver con el procedimiento croata.
    q1: ¿Cuándo me doy de baja en Suiza o en Argentina?
    q2: ¿Qué documentos debo asegurar antes de partir?
    q3: ¿Qué pasa con mi jubilación y mi cuenta?
    t1: Baja
    t2: Cierre fiscal
    t3: Fin del seguro
    t4: Cancelación de contratos
    t5: Asegurar la documentación de la jubilación
    t6: Solicitar certificados escolares
    t7: Cuenta bancaria
    t8: Poderes
  arbeit-und-qualifikation:
    title: Trabajo y cualificación
    intro: Si un título debe reconocerse y cómo se lee un contrato de trabajo en Croacia decide los primeros meses.
    q1: ¿Se reconoce mi título en Croacia?
    q2: ¿Cuánto queda neto del salario bruto?
    q3: ¿Está regulada mi profesión?
    t1: Mercado laboral
    t2: Búsqueda de empleo
    t3: Entender el contrato de trabajo
    t4: Bruto y neto
    t5: Reconocimiento de títulos académicos
    t6: Profesiones reguladas
    t7: Derechos laborales
    t8: Búsqueda de empleo de la pareja
    t9: El idioma en el trabajo
  unternehmen-gruenden:
    title: Emprender y trabajar por cuenta propia
    intro: Algunas ayudas exigen la solicitud antes de la constitución. Quien constituye primero y solicita después pierde el derecho.
    q1: ¿Qué forma jurídica me conviene?
    q2: ¿Qué es el negocio a tanto alzado?
    q3: ¿Debo solicitar la ayuda antes o después de constituir?
    t1: Formas jurídicas comparadas
    t2: Negocio a tanto alzado
    t3: Obligaciones contables
    t4: Cotizaciones
    t5: Autorizaciones
    t6: Orden respecto a las ayudas
    t7: Factura electrónica
    t8: Obligaciones corrientes
  steuern-geld-und-pension:
    title: Impuestos, dinero y jubilación
    intro: La residencia fiscal, la doble imposición y el cómputo de pensiones extranjeras son los temas en los que hay que consultar a un profesional croata.
    q1: ¿Dónde tributo si me mudo a mitad de año?
    q2: ¿Se grava mi pensión extranjera en Croacia?
    q3: ¿Cómo abro una cuenta bancaria?
    t1: Residencia fiscal
    t2: Doble imposición
    t3: Exención de cinco años del impuesto sobre el salario
    t4: Ingresos del extranjero
    t5: Pensiones extranjeras
    t6: Cómputo de la pensión
    t7: Convenios de seguridad social
    t8: Cuenta bancaria
    t9: Transferencias de dinero
  gesundheit-und-pflege:
    title: Salud y cuidados
    intro: El seguro empieza en un día distinto según la base. Quien no planifica la laguna se queda sin cobertura las primeras semanas.
    q1: ¿Desde cuándo tengo seguro de salud en Croacia?
    q2: ¿Cómo cubro el tiempo intermedio?
    q3: ¿Cómo encuentro médico de cabecera o pediatra?
    t1: Inicio del seguro según la base
    t2: Cobertura transitoria
    t3: Seguro complementario
    t4: Encontrar médico de cabecera y pediatra
    t5: Medicamentos
    t6: Embarazo
    t7: Enfermedad crónica
    t8: Cuidados
    t9: Accesibilidad
  kinder-schule-und-ausbildung:
    title: Hijos, escuela y formación
    intro: La inscripción, el distrito escolar y el apoyo lingüístico dependen del registro del domicilio. Los certificados extranjeros necesitan un procedimiento propio.
    q1: ¿Cómo inscribo a mi hijo en la escuela?
    q2: ¿Se reconocen los certificados?
    q3: ¿Hay apoyo lingüístico para niños sin croata?
    t1: Guardería
    t2: Inscripción
    t3: Distrito escolar
    t4: Reconocimiento de certificados
    t5: Apoyo lingüístico
    t6: Necesidades educativas especiales
    t7: Costes
    t8: Formación profesional
    t9: Estudios universitarios
    t10: Becas
  wohnen-und-regionen:
    title: Vivienda y regiones
    intro: Los alquileres anuales escasean por temporada en las regiones costeras. Los terrenos familiares heredados suelen tener copropietarios sin aclarar en el registro.
    q1: ¿Puedo comprar en Croacia como extranjero?
    q2: ¿Qué figura en el registro de la propiedad y por qué importa?
    q3: ¿Cómo encuentro un alquiler anual en la costa?
    t1: Alquiler de larga duración
    t2: Disponibilidad por temporada
    t3: Fianza
    t4: Gastos
    t5: Comprobación antes de comprar
    t6: Compra por extranjeros
    t7: Registro de la propiedad
    t8: Terreno familiar heredado
    t9: Copropietarios sin aclarar
    t10: Legalización
