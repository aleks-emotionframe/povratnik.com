    title: Idioma y comunidad
    intro: "El regreso rara vez fracasa en el registro, a menudo en la integración: el idioma, las asociaciones, las personas que le acompañan."
    q1: ¿Dónde aprendo croata, en línea y presencial?
    q2: ¿Hay becas para cursos de idioma?
    q3: ¿Cómo se integran la pareja y los hijos?
