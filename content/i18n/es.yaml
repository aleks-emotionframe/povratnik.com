# Catálogo en español. Versión de trabajo (CLAUDE.md 3): la versión alemana es la de
# referencia, los textos legales croatas rigen en su original. Las claves que faltan
# aquí se muestran en alemán (apps/web/src/lib/i18n.ts). Ortografía: es neutro.
results:
  unclear: Para la comprobación falta todavía esta información.
  condition_missing: Según sus datos, actualmente no cumple este requisito.
  unchecked: Según sus datos, este ámbito aún no se ha comprobado de forma concluyente.
  rule_conflict: Este punto requiere una aclaración profesional. La entidad competente es la indicada.
rules:
  example_address_report:
    matches: Según sus datos, el registro de ejemplo podría aplicarse. Sobre el registro decide la autoridad de ejemplo (ficticia).
  example_conflict_a:
    matches: Según sus datos, la regla ficticia A podría aplicarse.
  example_conflict_b:
    matches: Según sus datos, la regla ficticia B podría aplicarse.
  example_priority_a:
    matches: Según sus datos, la regla ficticia con prioridad 1 podría aplicarse.
  example_priority_b:
    matches: Según sus datos, la regla ficticia con prioridad 2 podría aplicarse.
  example_skip_rule:
    matches: Según sus datos, la regla ficticia con condición secundaria podría aplicarse.
  example_accommodation_rule:
    matches: Según sus datos, el registro de ejemplo del alojamiento podría aplicarse.
  example_passport_check:
    matches: Según sus datos, en el ejemplo ficticio podría aplicarse la comprobación del documento de viaje.
  example_eea_registration:
    matches: Según sus datos, en el ejemplo ficticio podría aplicarse la inscripción tras la entrada. Sobre la inscripción decide la autoridad de ejemplo (ficticia).
  example_descent_check:
    matches: Según sus datos, en el ejemplo ficticio podría aplicarse la comprobación de la cadena de ascendencia. Si los documentos bastan lo decide la autoridad de ejemplo (ficticia).
  example_remote_work_check:
    matches: Según sus datos, en el ejemplo ficticio podría aplicarse la vía para el trabajo remoto. Sobre la solicitud decide la autoridad de ejemplo (ficticia).
wizard:
  title: Mi camino a Croacia
  intro: "Unas preguntas y luego su primer plan. Sus respuestas se quedan en este navegador."
  progress: Pregunta {n} de {total}
  for_person: Para {person}
  unknown: Todavía no lo sé
  back: Atrás
  next: Continuar
  finish: Mostrar el plan
  restart: Empezar de nuevo
  remove: quitar
  household_label: Hogar
  add: Añadir
  edit: Cambiar
  print: Imprimir como PDF
  no_js: El chequeo rápido necesita JavaScript, porque la evaluación se hace en su navegador y sus respuestas no se envían a ningún sitio. Active JavaScript o use otro navegador.
  no_rules_title: Ninguna regla aprobada
  no_rules_text: Actualmente no hay ninguna regla revisada profesionalmente y publicada. Por eso el chequeo rápido aún no puede generar un plan.
  synthetic_banner: Reglas de ejemplo sintéticas
  synthetic_text: Este plan se basa en reglas de ejemplo inventadas, sin revisión profesional. No dice nada sobre su situación real.
  roles:
    self: Usted
    partner: Pareja
    child: Hijo o hija
    other: Otra persona
  q:
    stage:
      title: ¿En qué punto está?
      help: Quien ya ha entrado en Croacia recibe primero la comprobación de los plazos en curso.
      options:
        exploring: Todavía estoy explorando
        planning: Estoy planificando en concreto
        arrived: Ya estoy en Croacia
    household:
      title: ¿Quién se muda con usted?
      help: Cada persona tiene su propio camino. Su pareja y sus hijos pueden tener requisitos distintos a los suyos.
      options:
        alone: Yo solo o sola
        partner: Con mi pareja
        partner_children: Con pareja e hijos
        alone_children: Solo o sola con hijos
        others: Con otras personas
    country:
      title: ¿Dónde vive hoy esta persona?
      help: Determina la vía de los documentos, la legalización, la traducción y los deberes de baja.
      options:
        ar: Argentina
        cl: Chile
        de: Alemania
        ch: Suiza
        at: Austria
        ca: Canadá
        other: Otro país
    citizenship:
      title: ¿Qué nacionalidades tiene esta persona?
      help: Selección múltiple. Se pregunta por la nacionalidad, no por el pasaporte. Un pasaporte vencido no cambia la nacionalidad.
      options:
        hr: Croata
        eea: UE o EEE
        ch: Suiza
        other: Otra
        stateless: Apátrida
    link:
      title: ¿Existe un vínculo con Croacia?
      help: El vínculo abre caminos por el origen, sin prometer nada. Si una prueba basta lo decide la autoridad.
      options:
        parent: Un progenitor es o era croata
        ancestor: Abuelos o antepasados anteriores eran croatas
        former_residence: Vivió antes en Croacia
        partner: Pareja con vínculo croata
        none: Ningún vínculo
    horizon:
      title: ¿Cuándo será la mudanza?
      help: Determina el orden, no el contenido. Una fecha común es un escenario, no una fecha fija.
      options:
        within_6_months: En hasta 6 meses
        6_to_12_months: En 6 a 12 meses
        later_or_unclear: Más tarde o todavía no está claro
    income:
      title: ¿De qué vivirá esta persona en Croacia?
      help: Activa las preguntas sobre trabajo, formación y finanzas.
      options:
        employment: Empleo en Croacia
        self_employment: Actividad propia o emprendimiento
        remote_employer_abroad: Trabajo para un empleador en el extranjero
        pension_or_assets: Jubilación o patrimonio
        study: Estudios
    residence:
      title: ¿Qué estatus de residencia tiene esta persona en Croacia?
      help: El estatus decide qué reglas se aplican. Es algo distinto de la nacionalidad.
      options:
        eea_registered: Registrado como ciudadano de la UE, del EEE o de Suiza
        temporary_residence: Residencia temporal (privremeni boravak)
        diaspora_certificate: Residencia para emigrantes y descendientes
        digital_nomad: Nómada digital
        permanent_residence: Residencia permanente (stalni boravak)
        long_term_residence: Residencia de larga duración (dugotrajno boravište)
        none: Todavía sin estatus
    entry:
      title: ¿Cuándo entró esta persona en Croacia?
      help: La fecha de entrada activa plazos. Sin fecha, los plazos solo se pueden calcular cuando esté confirmada.
  refine:
    unknown: No lo sé
    done: respondido
    open: abierto
    children:
      title: "{person}: edad e idioma"
      help: Influye en la escuela, el apoyo lingüístico y el calendario.
      age:
        label: Edad
        0_5: 0 a 5 años
        6_14: 6 a 14 años
        15_18: 15 a 18 años
      croatian:
        label: Habla croata
        "yes": Sí
        some: Un poco
        "no": No
    founding:
      title: Su emprendimiento
      help: Influye en la elegibilidad para ayudas y en la trampa del orden.
      sector:
        label: Sector según la convocatoria
        allowed: Sector admitido
        excluded: Sector excluido (comercio, transporte, alojamiento, gastronomía, finanzas, inmobiliario)
      founded:
        label: Ya constituido
        "yes": Sí
        "no": No
    place:
      title: ¿Qué municipio?
      help: Muestra las ayudas municipales en el plan. En la fase de prueba, municipios ficticios.
      place:
        label: Destino
        none: Todavía sin destino
    property:
      title: Vivienda en el destino
      help: Influye en el registro de la propiedad, la herencia y la autorización de compra.
      property:
        label: Está previsto
        buy: Compra
        rent: Alquiler
        inherited: Propiedad familiar heredada
    pension:
      title: "{person}: jubilación"
      help: Influye en el cómputo y en la tributación.
      pension:
        label: De qué país
        ar: Argentina
        cl: Chile
        br: Brasil
        de: Alemania
        ch: Suiza
        at: Austria
        us: Estados Unidos
        ca: Canadá
        other: Otro país
    regulated:
      title: "{person}: profesión regulada"
      help: Por ejemplo profesiones sanitarias, docentes y jurídicas. El reconocimiento es un paso previo propio.
      regulated:
        label: La profesión está regulada
        "yes": Sí
        "no": No
    care:
      title: Cuidados y tratamiento continuo
      help: Influye en la atención en el destino y en la cobertura transitoria.
      care:
        label: Necesidad médica continua en el hogar
        "yes": Sí
        "no": No
